name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    container:
      image: node:26
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7.0.1
        with:
          # tags are needed to find the previous release for the compare link
          fetch-depth: 0

      - name: 🔓 Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📝 Release notes from CHANGELOG.md
        run: |
          sh scripts/release-notes.sh "${{ github.ref_name }}" > release-notes.md
          prev=$(git tag --sort=-v:refname | grep -v "^${{ github.ref_name }}$" | head -n 1 || true)
          if [ -n "$prev" ]; then
            printf '\n**Full changelog**: https://github.com/%s/compare/%s...%s\n' \
              "${{ github.repository }}" "$prev" "${{ github.ref_name }}" >> release-notes.md
          fi
          cat release-notes.md

      - name: 🧪 Test
        run: npx task test

      - name: 🏗️ Build
        run: npx task build

      - name: 🚀 Publish release with the bundle
        uses: softprops/action-gh-release@v3.0.4
        with:
          files: dist/safe-toggle-card.js
          body_path: release-notes.md
