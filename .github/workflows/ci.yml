name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Lint, test and build
    runs-on: ubuntu-latest
    container:
      image: node:26
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7.0.1

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint
        run: npx task lint

      - name: 🧪 Test
        run: npx task test

      - name: 🏗️ Build
        run: npx task build

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: ✅ Validate HACS repository
        uses: hacs/action@22.5.0
        with:
          category: plugin
