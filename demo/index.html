<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Safe Toggle Card demo</title>
    <link rel="stylesheet" href="./ha-theme.css" />
    <style>
      :root {
        color-scheme: light;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
      }
      body {
        margin: 0;
        padding: 16px;
        font-family: Roboto, system-ui, sans-serif;
        background: var(--primary-background-color);
        color: var(--primary-text-color);
      }
      .bar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr));
        gap: 16px;
        max-width: 960px;
      }
      pre {
        max-width: 960px;
        white-space: pre-wrap;
        font-size: 12px;
        color: var(--secondary-text-color);
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <button id="theme">Toggle dark mode</button>
      <button id="dir">Toggle RTL</button>
      <button id="lang">Toggle English / Polski</button>
    </div>
    <div class="grid" id="cards"></div>
    <pre id="log"></pre>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
