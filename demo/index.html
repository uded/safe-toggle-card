<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Safe Toggle Card demo</title>
    <style>
      :root {
        --primary-color: #03a9f4;
        --primary-text-color: #212121;
        --secondary-text-color: #727272;
        --text-primary-color: #fff;
        --card-background-color: #fff;
        --secondary-background-color: #e5e5e5;
        --divider-color: rgba(0, 0, 0, 0.12);
        --error-color: #db4437;
        --warning-color: #ffa600;
        --state-active-color: #ff9800;
        --state-inactive-color: #9e9e9e;
        --state-lock-locked-color: #4caf50;
        --state-lock-unlocked-color: #f44336;
        --state-unavailable-color: #bdbdbd;
        --ha-card-border-radius: 12px;
        --ha-card-box-shadow: none;
        --ha-card-border-color: #e0e0e0;
        color-scheme: light;
      }
      :root[data-theme='dark'] {
        --primary-text-color: #e1e1e1;
        --secondary-text-color: #9b9b9b;
        --card-background-color: #1c1c1c;
        --secondary-background-color: #2c2c2c;
        --divider-color: rgba(225, 225, 225, 0.12);
        --ha-card-border-color: #2f2f2f;
        color-scheme: dark;
      }
      body {
        margin: 0;
        padding: 16px;
        font-family: Roboto, system-ui, sans-serif;
        background: var(--secondary-background-color);
        color: var(--primary-text-color);
      }
      .bar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr));
        gap: 16px;
        max-width: 960px;
      }
      pre {
        max-width: 960px;
        white-space: pre-wrap;
        font-size: 12px;
        color: var(--secondary-text-color);
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <button id="theme">Toggle dark mode</button>
      <button id="dir">Toggle RTL</button>
      <button id="lang">Toggle English / Polski</button>
    </div>
    <div class="grid" id="cards"></div>
    <pre id="log"></pre>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
